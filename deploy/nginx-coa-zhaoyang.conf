# coa.zhaoyang.fr — 计组复习 (计算机组成原理复习网站), static SPA from /var/www/coa/current.
# Releases /var/www/coa/releases/<ts>, atomic symlink (scripts/release.sh in ~/Developer/coa-review on the Mac).
# Own certificate lineage; touches no shared file.
server {
    listen 80;
    listen [::]:80;
    server_name coa.zhaoyang.fr;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; try_files $uri =404; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name coa.zhaoyang.fr;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/coa.zhaoyang.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coa.zhaoyang.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/coa-error.log crit;
    root /var/www/coa/current;
    index index.html;
    client_max_body_size 1k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
    location = /version.txt { add_header Cache-Control "no-store" always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; }
    location / { try_files $uri /index.html; }
}
